<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Info Kegiatan Semarang</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #DC143C 0%, #FFD700 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
            animation: slideUp 0.5s ease-out;
        }

        .login-header {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            text-align: center;
            border-bottom: 3px solid #FFD700;
        }

        .logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.2));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .login-header h1 {
            color: #DC143C;
            font-size: 2em;
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .login-header p {
            color: #666;
            font-size: 1em;
        }

        .login-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .login-body {
            padding: 40px 35px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            border: 3px solid #FFD700;
            border-radius: 50px;
            font-size: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: #DC143C;
            box-shadow: 0 0 15px rgba(220, 20, 60, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #DC143C 0%, #FFD700 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(220, 20, 60, 0.4);
        }

        .login-btn:active {
            transform: translateY(-1px);
        }

        .error-message {
            background: #ffe6e6;
            border: 2px solid #DC143C;
            border-radius: 15px;
            color: #DC143C;
            padding: 15px 20px;
            margin-bottom: 25px;
            font-size: 0.95em;
            font-weight: 500;
            animation: shake 0.5s ease-in-out;
        }

        .success-message {
            background: #e6ffe6;
            border: 2px solid #28a745;
            border-radius: 15px;
            color: #28a745;
            padding: 15px 20px;
            margin-bottom: 25px;
            font-size: 0.95em;
            font-weight: 500;
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px solid #FFD700;
        }

        .back-link a {
            color: #DC143C;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-link a:hover {
            color: #FFD700;
            gap: 12px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @media (max-width: 480px) {
            .login-header h1 {
                font-size: 1.6em;
            }
            
            .login-body {
                padding: 30px 25px;
            }

            .logo {
                width: 90px;
                height: 90px;
            }
        }

        /* Input icons */
        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2em;
            color: #999;
        }

        .form-input.with-icon {
            padding-left: 50px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo Kota Semarang" class="logo">
            <div class="login-icon"></div>
            <h1>Login Admin</h1>
            <p>Info Kegiatan Semarang</p>
        </div>
        
        <div class="login-body">
            {% if error %}
            <div class="error-message">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            {% if success %}
            <div class="success-message">
                ✓ {{ success }}
            </div>
            {% endif %}

            <form method="post">
                <div class="form-group">
                    <label class="form-label" for="username">👤 Username</label>
                    <input 
                        type="text" 
                        class="form-input" 
                        id="username"
                        name="username" 
                        placeholder="Masukkan username"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">🔒 Password</label>
                    <input 
                        type="password" 
                        class="form-input" 
                        id="password"
                        name="password" 
                        placeholder="Masukkan password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="login-btn">
                    🔓 Masuk ke Dashboard
                </button>
            </form>

            <div class="back-link">
                <a href="/">← Kembali ke Beranda</a>
            </div>
        </div>
    </div>
</body>
</html>
