<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Kegiatan Semarang</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #DC143C 0%, #FFD700 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header with Logo */
        .header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.2));
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .header h1 {
            color: #DC143C;
            font-size: 2.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
        }

        .header p {
            color: #333;
            font-size: 1.2em;
        }

        /* Search Section */
        .search-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 18px 25px;
            font-size: 1.1em;
            border: 3px solid #FFD700;
            border-radius: 50px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: #DC143C;
            box-shadow: 0 0 15px rgba(220, 20, 60, 0.3);
        }

        .search-btn {
            padding: 18px 40px;
            font-size: 1.1em;
            font-weight: bold;
            background: linear-gradient(135deg, #DC143C 0%, #FFD700 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .reset-btn {
            color: #DC143C;
            background: none;
            border: none;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            color: #FFD700;
            transform: translateX(5px);
        }

        /* Events List Section */
        .events-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .events-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #FFD700;
        }

        .events-header h2 {
            color: #DC143C;
            font-size: 2em;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .badge {
            background: linear-gradient(135deg, #DC143C 0%, #FFD700 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9em;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .calendar-link {
            padding: 12px 30px;
            background: white;
            color: #DC143C;
            border: 3px solid #DC143C;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .calendar-link:hover {
            background: #DC143C;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 20, 60, 0.3);
        }

        .event-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            border-left: 5px solid #FFD700;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .event-card:hover {
            transform: translateX(10px);
            border-left-color: #DC143C;
            box-shadow: 0 8px 20px rgba(220, 20, 60, 0.2);
        }

        .event-title {
            color: #DC143C;
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .event-details {
            color: #666;
            margin-bottom: 15px;
        }

        .event-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-detail {
            background: linear-gradient(135deg, #DC143C 0%, #FFD700 100%);
            color: white;
            border: none;
        }

        .btn-detail:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 20, 60, 0.3);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .search-container {
                flex-direction: column;
            }

            .search-btn {
                width: 100%;
            }

            .events-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .logo {
                width: 60px;
                height: 60px;
            }

            .logo-container {
                flex-direction: column;
                gap: 15px;
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #DC143C;
        }

        .spinner {
            border: 4px solid #FFD700;
            border-top: 4px solid #DC143C;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <img src="/static/logo.png" alt="Logo Kota Semarang" class="logo">

                <div>
                    <h1>Info Kegiatan Semarang</h1>
                    <p>Temukan berbagai kegiatan menarik di Kota Semarang</p>
                </div>

            </div>
        </div>

        <div class="search-section">
            <form id="searchForm" class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Cari nama kegiatan..."
                    name="keyword">
                <button type="submit" class="search-btn">Cari</button>
            </form>
            <button class="reset-btn" onclick="resetSearch()">
                ↻ Reset Pencarian
            </button>
        </div>

        <div class="events-section">
            <div class="events-header">
                <h2>
                    📋 Daftar Kegiatan
                    <span class="badge" id="eventCount">2 Kegiatan Ditemukan</span>
                </h2>
                <a href="/kalender" class="calendar-link">Lihat Kalender Kegiatan</a>
            </div>

            <div id="eventsList">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Memuat data kegiatan...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchEvents(keyword = "") {
            try {
                const response = await fetch(`/api/list_kegiatan?keyword=${keyword}`);
                const events = await response.json();
                loadEvents(events);
            } catch (error) {
                console.error("Error:", error);
            }
        }

        function loadEvents(events) {
            const eventsList = document.getElementById('eventsList');
            const eventCount = document.getElementById('eventCount');

            if (events.length === 0) {
                eventsList.innerHTML = `
                <div style="text-align: center; padding: 40px; color: #666;">
                    <h3>Tidak ada kegiatan ditemukan</h3>
                </div>
            `;
                eventCount.textContent = '0 Kegiatan Ditemukan';
                return;
            }

            eventCount.textContent = `${events.length} Kegiatan Ditemukan`;

            eventsList.innerHTML = events.map(event => `
            <div class="event-card">
                ${event.gambar ? `
                    <img src="/static/file_uploads/${event.gambar}" 
                         style="width:100%; max-height:200px; object-fit:cover; border-radius:10px; margin-bottom:15px;">
                ` : ""}

                <div class="event-title">${event.nama_kegiatan}</div>
                <div class="event-details">
                    📅 ${event.tanggal} | 📍 ${event.lokasi}
                </div>
                <div class="event-details">
                    ${event.deskripsi}
                </div>
                <div class="event-actions">
                    <a href="/kegiatan/${event.id_kegiatan}" class="btn btn-detail">
                        Lihat Detail
                    </a>
                </div>
            </div>
        `).join('');
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            fetchEvents();
        }

        document.getElementById('searchForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const keyword = document.getElementById('searchInput').value;
            fetchEvents(keyword);
        });

        fetchEvents();
    </script>

</body>

</html>
